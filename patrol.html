<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2b3a55">
<title>パトロール履歴</title>
<style>
:root{--bg:#f3f5f8;--ink:#1f2937;--mut:#6b7686;--line:#e2e7ee;--navy:#2b3a55;--ok:#1f8a4c;--ng:#d1453b;--warn:#fdecea;--card:#fff;--accent:#e8790c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:18px;letter-spacing:.04em}header small{opacity:.8;font-size:12px}
main{max-width:860px;margin:0 auto;padding:12px 12px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;color:#56606e;text-decoration:none;font-size:12px;padding:6px 0 8px;min-height:56px}nav a span{display:block;font-size:22px}nav a.on{color:var(--navy);font-weight:700;background:#eaf0f8}
h2{font-size:20px;margin:6px 0 10px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}.sw b{font-size:18px}
button{font:inherit;border:1px solid #cdd5df;background:#fff;border-radius:10px;padding:8px 12px;min-height:44px;color:var(--ink)}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{display:flex;gap:8px}.sum div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.sum b{display:block;font-size:22px}.sum small{color:var(--mut)}
.site{display:flex;align-items:center;gap:10px;cursor:pointer}.site .nm{flex:1;min-width:0}.site .nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.site .nm small{color:var(--mut)}
.site .cnt{font-size:24px;font-weight:800;min-width:56px;text-align:right}.site .cnt small{font-size:12px;color:var(--mut);font-weight:500}
.site.short{border-color:#f3b4ae;background:var(--warn)}.mark{font-size:22px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#eef1f5;color:#4a5566;margin-right:4px}.tag.kai{background:#f1ecfb;color:#5b3a8e}
.sp{border:2px solid var(--accent);background:linear-gradient(180deg,#fff7ec,#fff)}.sp h3{margin:0 0 4px;color:#a24f00}.sp .bar{height:8px;border-radius:4px;background:#f3e2cc;overflow:hidden;margin:6px 0}.sp .bar i{display:block;height:100%;background:var(--accent)}
.sprow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #f0d9bd}.sprow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sprow b{min-width:44px;text-align:right}.sprow.ng .n{color:var(--ng);font-weight:700}
.dots{letter-spacing:2px}.muted{color:var(--mut)}.small{font-size:12px}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:70vh}
table{border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:0 6px;height:34px;text-align:center;border-bottom:1px solid #eef1f4;border-right:1px solid #f2f4f7;white-space:nowrap}
thead th{position:sticky;top:0;background:#f7f9fb;z-index:2}th.nm,td.nm{position:sticky;left:0;background:#fff;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;z-index:1;box-shadow:2px 0 3px -2px rgba(0,0,0,.15)}thead th.nm{z-index:3;background:#f7f9fb}
td.c{min-width:34px;cursor:pointer;font-weight:700}td.red{background:#fdecea;color:var(--ng)}td.z{color:#c3cad4;font-weight:400}tr.kai td.nm{color:#5b3a8e}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid #eef1f4}.ev .d{min-width:86px;font-weight:700}.ev .t{flex:1}.ev .why{font-size:12px;color:var(--mut)}
.q{border-left:4px solid var(--accent)}.q select{font:inherit;min-height:44px;max-width:100%;border-radius:10px;border:1px solid #cdd5df;padding:0 6px}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#eef1f5}.pill.grey{background:#e5e7ea}.pill.group{background:#e8f0fe;color:#1a56b8}.pill.event{background:#f1ecfb;color:#5b3a8e}
.login{max-width:420px;margin:40px auto}input[type=password],input[type=text],input[type=date],input[type=number]{font:inherit;width:100%;min-height:44px;border:1px solid #cdd5df;border-radius:10px;padding:0 10px}
.note{background:#fff8e1;border:1px solid #f3d27a;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:20}#sheet[hidden]{display:none}#sheet .box{background:#fff;width:100%;max-width:600px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:80vh;overflow:auto}
textarea{font:inherit;width:100%;border:1px solid #cdd5df;border-radius:10px;padding:8px 10px;resize:vertical}select{font:inherit;width:100%;min-height:44px;border:1px solid #cdd5df;border-radius:10px;padding:0 6px;background:#fff}input[type=search]{font:inherit;width:100%;min-height:44px;border:1px solid #cdd5df;border-radius:10px;padding:0 10px}
.cat{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:700}.c1{background:#fff1e0;color:#a24f00}.c2{background:#fdecea;color:#b3261e}.c3{background:#e8f0fe;color:#1a56b8}.c4{background:#eef1f5;color:#4a5566}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{min-height:40px;border-radius:999px;padding:6px 12px;font-size:14px;border:1px solid #cdd5df;background:#fff}.chip.on{border:2px solid var(--navy);font-weight:700;box-shadow:0 0 0 2px #dbe4f0}.chip.c1.on{background:#fff1e0}.chip.c2.on{background:#fdecea}.chip.c3.on{background:#e8f0fe}.chip.c4.on{background:#eef1f5}
.note-c{cursor:pointer}.note-c .nh,.nh{display:flex;align-items:center;gap:8px}.note-c .ns{font-size:13px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nt{white-space:pre-wrap;word-break:break-word;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.nt.full{display:block;-webkit-line-clamp:unset}
.ph{margin:8px 0;color:var(--mut);font-size:13px}.ph img{display:block;max-width:100%;max-height:60vh;border-radius:10px;border:1px solid var(--line)}.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid #cdd5df;border-radius:10px;background:#fff;cursor:pointer}.nf select{margin-top:2px}
</style>
</head>
<body>
<header><b>パトロール履歴</b><small id="status"></small></header>
<main id="main"><p>読み込み中…</p></main>
<nav id="nav" hidden><a href="#month" data-nav="month"><span>📋</span>今月</a><a href="#year" data-nav="year"><span>📅</span>年度</a><a href="#notes" data-nav="notes"><span>💡</span>気づき</a><a href="#check" data-nav="check"><span>🔍</span>除外チェック</a><a href="#settings" data-nav="settings"><span>⚙️</span>設定</a></nav>
<div id="sheet" hidden></div>
<script type="module" src="patrol.js"></script>
</body>
</html>
