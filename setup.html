<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>鍵の設定（管理者用）</title><link rel="stylesheet" href="style.css"></head><body>
<header><div id="title">鍵の設定（管理者用）</div></header><main>
<div class="card"><p>GitHub のトークンを合言葉で暗号化して、<code>config.js</code> に貼る文字を作ります。<b>このページの中だけで計算し、どこにも送信しません。</b></p>
<label class="f">GitHub トークン（github_pat_…）</label><input id="tok" type="password" autocomplete="off">
<label class="f">合言葉（12文字以上。長いほど安全）</label><input id="p1" type="password" autocomplete="new-password">
<label class="f">合言葉（もう一度）</label><input id="p2" type="password" autocomplete="new-password">
<button class="primary wide" id="mk">暗号化する</button>
<label class="f">config.js の encToken に貼る値</label><textarea id="out" rows="6" readonly></textarea>
<p class="muted small">合言葉を変えるとき：同じトークンと新しい合言葉でもう一度作り、config.js を差し替えてください。合言葉が漏れたときは、トークンも GitHub で作り直す（古いトークンは削除）のが安全です。</p></div>
</main>
<script type="module">
import { encryptSecret, decryptSecret } from './crypto.js';
const $ = s => document.querySelector(s);
$('#mk').onclick = async () => {
  const t = $('#tok').value.trim(), a = $('#p1').value.trim(), b = $('#p2').value.trim();
  if (!t.startsWith('github_pat_')) return alert('github_pat_ で始まるトークンを入れてください');
  if (a.length < 12) return alert('合言葉は12文字以上にしてください'); if (a !== b) return alert('合言葉が一致しません');
  $('#out').value = '計算中…'; const blob = await encryptSecret(t, a);
  if ((await decryptSecret(blob, a)) !== t) return alert('検証失敗');
  $('#out').value = JSON.stringify(blob); $('#tok').value = '';
};
</script></body></html>
